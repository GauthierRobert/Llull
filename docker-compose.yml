# llull on-prem. Put a TLS reverse proxy (Caddy/nginx/Traefik) in front, see docs/DEPLOYMENT.md.
#   docker compose up -d --build
#   docker compose exec llull node server/scripts/add-user.mjs ada "Ada Admin" admin
services:
  llull:
    build:
      context: .
      args:
        # Where browsers reach the server (baked into the web bundle).
        LLULL_PUBLIC_URL: ${LLULL_PUBLIC_URL:-http://localhost:3001}
    image: llull:latest
    restart: unless-stopped
    ports:
      - '${LLULL_BIND:-127.0.0.1}:3001:3001'
    environment:
      # Browser origin(s) allowed to call the API (your public URL).
      LLULL_ALLOWED_ORIGINS: ${LLULL_PUBLIC_URL:-http://localhost:3001}
      # Host header(s) accepted behind the proxy, e.g. cad.example.com
      LLULL_ALLOWED_HOSTS: ${LLULL_ALLOWED_HOSTS:-localhost}
      LLULL_TOOLSETS: ${LLULL_TOOLSETS:-core}
      # License verification (PEM from `license.mjs keygen`, one line with \n escapes).
      LLULL_LICENSE_PUBLIC_KEY: ${LLULL_LICENSE_PUBLIC_KEY:-}
      LLULL_AUDIT_MAX_BYTES: ${LLULL_AUDIT_MAX_BYTES:-10485760}
      LLULL_AUDIT_KEEP: ${LLULL_AUDIT_KEEP:-5}
    volumes:
      - llull-autosave:/data/autosave # the shared live document
      - llull-audit:/data/audit # audit.jsonl (+ rotated .1 ... .N)
      - llull-users:/data/users # users.json (token hashes only)
      - llull-license:/data/license # license.key
volumes:
  llull-autosave:
  llull-audit:
  llull-users:
  llull-license:
