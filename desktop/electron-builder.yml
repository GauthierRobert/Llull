# llull desktop packaging. Run `npm run dist` on each target OS (native wheels, the bundled
# Python and the native binaries + OCCT are per platform). Signing/notarization: set the usual electron-builder env
# (CSC_LINK / CSC_KEY_PASSWORD, APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID).
appId: app.llull.desktop
productName: llull
copyright: Copyright © llull
directories:
  output: release
files:
  - dist/**
  - package.json
extraResources:
  # Renderer bundle (npm run build:web); the backend serves it, so the API base is the page origin.
  - from: ../dist
    to: web
  # Server bundle + CLI (dist/cli.js) + production node_modules + Python bridge script.
  # Copied from build/ (not build/server): electron-builder always drops a node_modules at the root of `from`.
  - from: build
    to: .
    filter: ['server/**/*']
  # Relocatable CPython with CadQuery (npm run prepare:python).
  - from: build/python
    to: python
  # Native binaries llull-compute + llull-kernel, shared OCCT (occt/lib, LGPL-2.1 dynamic) and their licence notices
  # (npm run prepare:native). The backend gets LLULL_NATIVE_DIR only when this folder holds a binary.
  - from: build/native
    to: native
  # User-facing agent skills (SC-A1): `llull skills install` copies them from resources/skills into ~/.claude/skills.
  - from: ../skills
    to: skills
fileAssociations:
  - ext: llull
    name: llull document
    role: Editor
mac:
  category: public.app-category.graphics-design
  hardenedRuntime: true
  target: [dmg, zip]
win:
  target: [nsis]
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  category: Graphics
  target: [AppImage, deb]
# Electron fuses: no NODE_OPTIONS / --inspect injection into the packaged app, and only the
# integrity-checked asar loads. RunAsNode stays on: the `llull` CLI shim runs the bundled CLI
# with ELECTRON_RUN_AS_NODE.
electronFuses:
  runAsNode: true
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
