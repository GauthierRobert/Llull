[package]
name = "llull-compute"
description = "llull native job binary: `llull-compute <job> <job-folder>` (RS1 §2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
llull-cloud = { path = "../../crates/llull-cloud", default-features = false }
llull-post = { path = "../../crates/llull-post" }
llull-protocol = { path = "../../crates/llull-protocol" }
llull-raster = { path = "../../crates/llull-raster" }
llull-route = { path = "../../crates/llull-route" }
llull-topopt = { path = "../../crates/llull-topopt", default-features = false }
llull-voxfe = { path = "../../crates/llull-voxfe", default-features = false }
llull-stats = { path = "../../crates/llull-stats" }
llull-panel = { path = "../../crates/llull-panel" }
llull-explicit = { path = "../../crates/llull-explicit" }
llull-geomq = { path = "../../crates/llull-geomq" }
llull-field = { path = "../../crates/llull-field" }
llull-meshops = { path = "../../crates/llull-meshops", features = ["quad"] }
llull-flow-lbm = { path = "../../crates/llull-flow-lbm", default-features = false }

[features]
# wgpu paths: offscreen raster (`llull-compute raster` with engine "gpu"), the topopt GPU solves (settings.device "gpu" / "auto") and the
# lattice-Boltzmann flow kernels. Off by default (keeps the release build short); without it the CPU twins answer and a GPU request reports a warning.
gpu = ["llull-raster/gpu", "llull-topopt/gpu", "llull-cloud/gpu", "llull-explicit/gpu", "llull-flow-lbm/gpu"]

[lints]
workspace = true
