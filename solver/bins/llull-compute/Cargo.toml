[package]
name = "llull-compute"
description = "llull native job binary: `llull-compute <job> <job-folder>` (RS1 §2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
llull-post = { path = "../../crates/llull-post" }
llull-protocol = { path = "../../crates/llull-protocol" }
llull-raster = { path = "../../crates/llull-raster" }
llull-topopt = { path = "../../crates/llull-topopt", default-features = false }

[features]
# wgpu paths: offscreen raster (`llull-compute raster` with engine "gpu") and the topopt GPU solves (settings.device "gpu" / "auto").
# Off by default (keeps the release build short); without it the CPU twins answer and a GPU request reports a warning.
gpu = ["llull-raster/gpu", "llull-topopt/gpu"]

[lints]
workspace = true
