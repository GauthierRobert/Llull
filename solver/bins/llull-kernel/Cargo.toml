[package]
name = "llull-kernel"
description = "llull native geometry kernel sidecar: KernelOps request/reply over stdio NDJSON (RS-1)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
llull-kernel-occt = { path = "../../crates/llull-kernel-occt" }
base64 = "0.22"
serde.workspace = true
# unbounded_depth: request lines nest one level per sequential boolean; the cap is our own linear scan (src/request.rs)
serde_json = { workspace = true, features = ["unbounded_depth"] }

[lints]
workspace = true
