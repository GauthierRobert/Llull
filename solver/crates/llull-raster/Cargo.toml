[package]
name = "llull-raster"
description = "Offscreen raster of llull-compute (field plots and render_view scenes): bit-exact CPU twins of the TypeScript rasters, optional wgpu path (RS1 RS-5)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# wgpu offscreen path (a picture: not bit-identical); without an adapter the CPU twin answers with a logged reason.
gpu = ["dep:wgpu", "dep:llull-gpu", "llull-gpu/wgpu"]

[dependencies]
llull-jsmath = { path = "../llull-jsmath" }
llull-protocol = { path = "../llull-protocol" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
llull-gpu = { path = "../llull-gpu", optional = true }
wgpu = { workspace = true, optional = true }

[lints]
workspace = true
