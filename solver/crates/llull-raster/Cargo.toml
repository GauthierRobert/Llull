[package]
name = "llull-raster"
description = "Offscreen field-plot raster of llull-compute: bit-exact CPU twin of fieldRaster.ts, optional wgpu path (RS1 RS-5)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# wgpu offscreen path (a picture: not bit-identical); without an adapter the CPU twin answers with a logged reason.
gpu = ["dep:wgpu", "dep:pollster"]

[dependencies]
llull-jsmath = { path = "../llull-jsmath" }
llull-protocol = { path = "../llull-protocol" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
wgpu = { version = "25", optional = true, default-features = false, features = ["wgsl", "vulkan", "metal", "dx12"] }
pollster = { version = "0.4", optional = true }

[lints]
workspace = true
