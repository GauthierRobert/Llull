[package]
name = "llull-explicit"
description = "PHY-19 explicit dynamics (RS1 RS-8): central difference, lumped mass, hex8 / tet4, Johnson-Cook, rigid walls; the `llull-compute explicit` job"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = []
# wgpu kernels (`device: gpu | auto`): f64 compute shaders, needs an adapter with SHADER_F64. Without it the CPU twin runs.
gpu = ["llull-gpu/wgpu"]

[dependencies]
llull-gpu = { path = "../llull-gpu" }
llull-protocol = { path = "../llull-protocol" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
