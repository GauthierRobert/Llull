[package]
name = "llull-cloud"
description = "Plant 10 point clouds (RS1 RS-3 / RS-4): E57 / LAS / LAZ / ASCII readers, octree asset, kd-tree, fits, registration, deviation, clash"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["gpu"]
# RS-4: wgpu distances for the deviation picture and the conservative clash prune (device "gpu"). Without it a GPU request runs the
# CPU twin with a SCN_GPU_FALLBACK warning; the recorded numbers are the CPU's either way.
gpu = ["dep:wgpu", "llull-gpu/wgpu"]

[dependencies]
e57 = "0.11"
las = { version = "0.11", features = ["laz"] }
libm = "0.2"
llull-bvh = { path = "../llull-bvh" }
llull-gpu = { path = "../llull-gpu" }
llull-protocol = { path = "../llull-protocol" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
wgpu = { workspace = true, optional = true }

[lints]
workspace = true
