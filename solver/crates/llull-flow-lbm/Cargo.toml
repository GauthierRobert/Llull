[package]
name = "llull-flow-lbm"
description = "12 CFD low-speed solver: D3Q19 lattice Boltzmann (BGK + Smagorinsky LES, half-way bounce-back, far-field / slip / ground faces, momentum-exchange forces) as a Rust CPU twin + wgpu kernels; the `llull-compute flow` job (RS1 §2)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["gpu"]
# wgpu kernels (device "gpu" / "auto"): f32 compute shaders mirroring the CPU kernel cell for cell. Without them a GPU request runs the CPU twin with a warning.
gpu = ["llull-gpu/wgpu"]

[dependencies]
llull-flow-core = { path = "../llull-flow-core" }
llull-gpu = { path = "../llull-gpu" }
llull-protocol = { path = "../llull-protocol" }
rayon.workspace = true
serde.workspace = true
serde_json.workspace = true

[lints]
workspace = true
