# llull native compute workspace (docs/decisions/RS1-native-compute.md).
[workspace]
resolver = "2"
members = ["crates/*", "bins/*"]
# The OCCT kernel and the FE mesher link a shared OpenCascade built by solver/scripts/build-occt.mjs (slow first build), the mesher also
# a shared Netgen built by solver/scripts/build-netgen.mjs; `npm run native:check` skips them unless LLULL_NATIVE_KERNEL=1.
default-members = [
  "crates/llull-protocol",
  "crates/llull-jsmath",
  "crates/llull-bvh",
  "crates/llull-post",
  "crates/llull-raster",
  "crates/llull-gpu",
  "crates/llull-voxfe",
  "crates/llull-topopt",
  "crates/llull-route",
  "crates/llull-stats",
  "crates/llull-panel",
  "crates/llull-explicit",
  "crates/llull-cloud",
  "crates/llull-geomq",
  "crates/llull-field",
  "crates/llull-meshops",
  "crates/llull-flow-core",
  "crates/llull-flow-lbm",
  "bins/llull-compute",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# float_roundtrip: parse JSON numbers exactly as JavaScript prints them (native results must match the TypeScript bit for bit).
serde_json = { version = "1", features = ["float_roundtrip"] }
rayon = "1"
sha2 = "0.10"
wgpu = { version = "25", default-features = false, features = ["wgsl", "vulkan", "metal", "dx12"] }
pollster = "0.4"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The voxel FE / SIMP tests solve real benchmark grids (MBB 60x20, 3D cantilevers): optimise those crates in test builds too.
[profile.dev.package.llull-voxfe]
opt-level = 3

[profile.dev.package.llull-topopt]
opt-level = 3

[profile.dev.package.llull-gpu]
opt-level = 3

# The router tests run the 2e6-expansion budget problem (VC-RTE-25).
[profile.dev.package.llull-route]
opt-level = 3

# The explicit benchmarks integrate tens of thousands of cycles (bar wave, drop, contact search on llull-bvh).
[profile.dev.package.llull-explicit]
opt-level = 3

# Plant 10 point clouds: the fit / ICP tests run on the pack's real clouds (bunny 30 571 points, CYL-B 8 000).
[profile.dev.package.llull-cloud]
opt-level = 3

# Geometric query batches (RS-6): the parity tests run seeded meshes with thousands of triangles and view-factor cavities.
[profile.dev.package.llull-geomq]
opt-level = 3

# Field engine (05 IMP M4): the parity tests mesh 60-100 cube grids and measure 10^5-10^6 samples.
[profile.dev.package.llull-field]
opt-level = 3

[profile.dev.package.llull-bvh]
opt-level = 3

# 12 CFD: the lattice-Boltzmann tests run thousands of steps on 10^4..10^5 cells (Poiseuille order, Taylor-Green, sphere).
[profile.dev.package.llull-flow-core]
opt-level = 3

[profile.dev.package.llull-flow-lbm]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1

# llull-compute jobs: fat LTO + abort on panic measured ~5 % faster on the 50k-node fatigue job (no unwind paths in the hot loops). Not for
# llull-kernel, which catches panics per request (NATIVE_PANIC). Build: cargo build --profile compute -p llull-compute (target/compute/).
[profile.compute]
inherits = "release"
lto = "fat"
panic = "abort"
