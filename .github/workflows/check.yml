name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Typecheck + Lint + Test + Coverage
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install server dependencies
        run: npm ci --prefix server

      # Canonical gate: typecheck + lint + tests (mirrors `npm run check`)
      - name: Run check (typecheck + lint + tests)
        run: npm run check

      # Coverage gate: 90/85/90/90 on packages/core/src/commands/** and packages/domain-aec/src/**
      - name: Run coverage (90/85/90/90 gate)
        run: npm run test:coverage

      # Server: typecheck + tests + production bundle (what `npm --prefix server start` runs)
      - name: Server typecheck
        run: npm --prefix server run typecheck

      - name: Server tests
        run: npm --prefix server test

      - name: Server build
        run: npm --prefix server run build

      # Production web build (tsc -b + vite build)
      - name: App build
        run: npm run build

      # Registry 1:1 guard: listCommands() must match toToolSchemas() exactly
      - name: Registry schema 1:1 guard
        run: server/node_modules/.bin/tsx scripts/check-registry-schema.ts

  e2e:
    name: End-to-end (Playwright)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run Playwright
        run: npm run test:e2e

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
