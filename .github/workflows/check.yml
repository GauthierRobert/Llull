# Runs the same gate as `npm run check` (typecheck + architecture rules + lint + format + tests)
# plus the coverage gate and the server suite, so the architecture laws hold for every change.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm run typecheck
      - run: npm run arch
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - run: npm --prefix server run typecheck
      - run: npm --prefix server test
