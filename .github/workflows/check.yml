# Runs the same gate as `npm run check` (typecheck + architecture rules + unused exports + lint +
# format + tests)
# plus the coverage gate, the server + desktop suites and the production builds (renderer, server), so the
# architecture laws hold for every change.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Rust workspace solver/ (docs/decisions/RS1-native-compute.md): fmt + clippy -D warnings + tests of the default members.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solver/target
          key: native-${{ runner.os }}-${{ hashFiles('solver/Cargo.lock', 'solver/**/Cargo.toml', 'solver/rust-toolchain.toml') }}
          restore-keys: native-${{ runner.os }}-
      # solver/rust-toolchain.toml pins the compiler + rustfmt / clippy (same lints as local builds).
      - run: rustup toolchain install
        working-directory: solver
      - run: node scripts/nativeCheck.mjs

  # Native OCCT kernel (RS-1): crate llull-kernel-occt + bin llull-kernel (clippy, cargo test), every server suite that runs the real kernel
  # (closed-form expectations; the WASM kernel is retired, LC1 step 5), then
  # the desktop native bundle. OCCT 7.9.2 is built SHARED by solver/scripts/build-occt.mjs (pinned source + sha256, ~60 min on 4 cores)
  # into an install prefix cached by version + source sha + recipe; warm runs reuse it through LLULL_OCCT_DIR and take a few minutes.
  native-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      LLULL_OCCT_DIR: ${{ github.workspace }}/occt-7.9.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: actions/cache@v4
        id: occt
        with:
          path: occt-7.9.2
          key: occt-7.9.2-f6e272b6-${{ runner.os }}-${{ hashFiles('solver/scripts/build-occt.mjs') }}
      - name: Build OCCT 7.9.2 shared (cache miss only)
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          sudo apt-get install -y ninja-build
          node solver/scripts/build-occt.mjs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-kernel-${{ runner.os }}-${{ hashFiles('solver/Cargo.lock') }}
      - run: rustup toolchain install
        working-directory: solver
      - run: node scripts/nativeCheck.mjs
        env:
          LLULL_NATIVE_KERNEL: '1'
      - run: cargo build --release -p llull-kernel
        working-directory: solver
      - run: npm ci
      - run: npm --prefix server ci
      - run: npm test
        working-directory: server
        env:
          LLULL_REQUIRE_NATIVE_KERNEL: '1'
      # The desktop bundle as shipped: llull-compute (gpu), llull-kernel resolving OCCT via $ORIGIN/occt/lib only, licence notices.
      - run: node desktop/scripts/prepare-native.mjs
      - run: ldd desktop/build/native/llull-kernel && ! ldd desktop/build/native/llull-kernel | grep 'not found'

  # The desktop native bundle on Windows (macOS deferred): OCCT 7.9.2 shared (cached per OS), llull-compute + llull-kernel, prepare-native.mjs
  # (which runs both bundled binaries with --version), then the native kernel parity suite against the bundle itself.
  native-bundle:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest] # macOS deferred (owner, 2026-10-19)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 240
    env:
      LLULL_OCCT_DIR: ${{ github.workspace }}/occt-7.9.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - uses: actions/cache@v4
        id: occt
        with:
          path: occt-7.9.2
          key: occt-7.9.2-f6e272b6-${{ runner.os }}-${{ hashFiles('solver/scripts/build-occt.mjs') }}
      - name: Build OCCT 7.9.2 shared (cache miss only)
        if: steps.occt.outputs.cache-hit != 'true'
        run: node solver/scripts/build-occt.mjs
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-bundle-${{ runner.os }}-${{ hashFiles('solver/Cargo.lock', 'solver/rust-toolchain.toml') }}
      - run: rustup toolchain install
        working-directory: solver
      - run: node desktop/scripts/prepare-native.mjs
      - run: npm ci
      - run: npm --prefix server ci
      - run: npx vitest run --config vitest.config.mts tests/nativeKernelPrimitives.test.ts tests/nativeKernel.test.ts tests/nativeBinary.test.ts
        working-directory: server
        env:
          LLULL_REQUIRE_NATIVE_KERNEL: '1'
          LLULL_NATIVE_DIR: ${{ github.workspace }}/desktop/build/native

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      # Electron's binary is not needed: the desktop suite runs the real backend without it.
      - run: npm --prefix desktop ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # tsc --incremental, eslint --cache and prettier --cache state (restored after npm ci, which wipes node_modules).
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: static-gates-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'eslint.config.js', '.prettierrc*') }}-${{ github.sha }}
          restore-keys: static-gates-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'eslint.config.js', '.prettierrc*') }}-
      # typecheck + arch + deadcode + lint + format:check, concurrently (each prints its own block).
      - run: node scripts/runParallel.mjs typecheck arch deadcode lint format:check
      - run: npm run test:coverage
      - run: npm --prefix server run typecheck
      - run: npm --prefix server test
      - run: npm --prefix desktop run typecheck
      - run: npm --prefix desktop test
      # Production artifacts: the renderer bundle and the server bundle must build.
      - run: npm run build
      - run: npm --prefix server run build

  # The real app in Chromium (Vite dev server, offline mode): catches UI / export drift the unit
  # suites cannot see.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
