# Runs the same gate as `npm run check` (typecheck + architecture rules + unused exports + lint +
# format + tests)
# plus the coverage gate, the server + desktop suites and the production builds (web, server; the image
# job builds and smoke-tests the on-prem image), so the architecture laws hold for every change.
name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  # Rust workspace solver/ (docs/decisions/RS1-native-compute.md): fmt + clippy -D warnings + tests of the default members.
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            solver/target
          key: native-${{ runner.os }}-${{ hashFiles('solver/Cargo.lock', 'solver/**/Cargo.toml') }}
          restore-keys: native-${{ runner.os }}-
      - run: rustup component add rustfmt clippy
      - run: node scripts/nativeCheck.mjs

  # Native OCCT kernel (RS-1): crate llull-kernel-occt + bin llull-kernel (clippy, cargo test), then the native-vs-WASM parity suite.
  # OCCT 7.8.1 builds from source once per version (~70 min on 4 cores) into an install dir cached by version; warm runs reuse it
  # through LLULL_OCCT_DIR and take a few minutes.
  native-kernel:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      LLULL_OCCT_DIR: ${{ github.workspace }}/occt-7.8.1
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: occt
        with:
          path: occt-7.8.1
          key: occt-7.8.1-${{ runner.os }}-v1
      - name: Build OCCT 7.8.1 (cache miss only)
        if: steps.occt.outputs.cache-hit != 'true'
        run: |
          (cd solver && env -u LLULL_OCCT_DIR cargo build --release -p llull-kernel-occt)
          mkdir -p occt-7.8.1 && cp -r solver/target/OCCT/include solver/target/OCCT/lib occt-7.8.1/
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: native-kernel-${{ runner.os }}-${{ hashFiles('solver/Cargo.lock') }}
      - run: rustup component add rustfmt clippy
      - run: node scripts/nativeCheck.mjs
        env:
          LLULL_NATIVE_KERNEL: '1'
      - run: cargo build --release -p llull-kernel
        working-directory: solver
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      - run: npx vitest run --config vitest.config.mts tests/nativeKernelParity.test.ts tests/nativeKernel.test.ts
        working-directory: server
        env:
          LLULL_REQUIRE_NATIVE_KERNEL: '1'

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
            desktop/package-lock.json
      - run: npm ci
      - run: npm --prefix server ci
      # Electron's binary is not needed: the desktop suite runs the real backend without it.
      - run: npm --prefix desktop ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      # tsc --incremental, eslint --cache and prettier --cache state (restored after npm ci, which wipes node_modules).
      - uses: actions/cache@v4
        with:
          path: node_modules/.cache
          key: static-gates-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'eslint.config.js', '.prettierrc*') }}-${{ github.sha }}
          restore-keys: static-gates-${{ hashFiles('package-lock.json', 'tsconfig*.json', 'eslint.config.js', '.prettierrc*') }}-
      # typecheck + arch + deadcode + lint + format:check, concurrently (each prints its own block).
      - run: node scripts/runParallel.mjs typecheck arch deadcode lint format:check
      - run: npm run test:coverage
      - run: npm --prefix server run typecheck
      - run: npm --prefix server test
      - run: npm --prefix desktop run typecheck
      - run: npm --prefix desktop test
      # Production artifacts: the web bundle, the server bundle and the on-prem image must build.
      - run: npm run build
      - run: npm --prefix server run build

  # The real app in Chromium (Vite dev server, offline mode): catches UI / export drift the unit
  # suites cannot see.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results

  # The on-prem image exactly as shipped (LibreDWG included, checksum-pinned), then a smoke run.
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t llull:ci .
      - name: Smoke-test the image
        run: |
          docker run --rm --entrypoint dwg2dxf llull:ci --version
          docker run -d --name llull -p 127.0.0.1:3001:3001 llull:ci
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:3001/health && break; sleep 2; done
          curl -fsS http://127.0.0.1:3001/health | grep -q '"status":"ok"'
          curl -fsSI http://127.0.0.1:3001/ | grep -qi 'content-security-policy'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3001/live/snapshot)" = 401
      - if: failure()
        run: docker logs llull || true
